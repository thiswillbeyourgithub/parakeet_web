version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /app
      - /app/ui
      - /signaling
      - /scripts/openai-like-server
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /docker
      - /scripts/openai-like-server
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
